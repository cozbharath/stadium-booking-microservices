spring:
    application:
        name: auth-service
    config:
        import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071}
    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true}
        username: root
        password: ${DB_PASSWORD:}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
    flyway:
        enabled: false

server:
    port: 8081

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    instance:
        prefer-ip-address: true

jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-dev-only-jwt-secret-change-me}
    expiration: 86400000
internal:
    token: ${INTERNAL_TOKEN:change-me-internal-token}

otp:
    secret: ${OTP_SECRET:${JWT_SECRET:dev-only-otp-secret-change-me-dev-only-otp-secret}}
    length: 6
    ttl-seconds: 300
    max-attempts: 5
    resend-cooldown-seconds: 30
    max-sends-per-window: 3
    window-seconds: 600
    daily-send-limit: ${OTP_DAILY_LIMIT:300}

sms:
    provider: ${SMS_PROVIDER:log}
    twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}
    fast2sms:
        api-key: ${FAST2SMS_API_KEY:}
        route: otp
