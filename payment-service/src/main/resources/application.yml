spring:
    application:
        name: payment-service
    config:
        import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071}
    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
    flyway:
        enabled: false

server:
    port: 8084

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    instance:
        prefer-ip-address: true

jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-dev-only-jwt-secret-change-me}
    expiration: 86400000
internal:
    token: ${INTERNAL_TOKEN:change-me-internal-token}

razorpay:
    key:
        id: ${RAZORPAY_KEY_ID:}
        secret: ${RAZORPAY_KEY_SECRET:}
